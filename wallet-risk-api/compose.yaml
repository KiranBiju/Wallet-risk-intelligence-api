version: '3.9'

services:

  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - db
    env_file:
      - .env

    frontend:
      build:
        context: .
        dockerfile: frontend/Dockerfile
      ports:
        - "8501:8501"
      environment:
        API_BASE_URL: http://api:8000
      depends_on:
        - api  

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: wallet_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: